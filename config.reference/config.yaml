    bezelAlpha: 0.7218120805369128
    bezelWidth: 645.3884228187919
    loadOnStartup: false
    pasteMovesToTop: true
    previousSyncClippingsViaICloud: false
    removeDuplicates: true
    skipPasswordFields: false
    stickyBezel: true
- domain: com.googlecode.iterm2
