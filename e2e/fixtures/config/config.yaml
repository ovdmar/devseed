# e2e fixture: exercises every builtin + custom step kinds.
# The template VM has Cursor, so this exercises the locate/list/install
# path rather than only the "not installed" branch.
brew:
  casks:
  - jira-ticket-cli
  formulae:
  - tree
  taps:
  - open-cli-collective/tap
cursor_extensions:
- waderyan.gitblame
defaults_restart:
  com.apple.dock: Dock
dotfiles:
  files:
  - .devseed-e2e-rc
  - .config/devseed-e2e/nested.conf
extras:
- cask: appcleaner
  key: hello-ext
  kind: cask
  label: Hello extra (cask)
git_repos:
- dest: '{workspace}/hello'
  url: https://github.com/octocat/Hello-World.git
identity:
  git_email: e2e@devseed.test
  git_name: Devseed E2E
macos_defaults:
- domain: com.apple.dock
  values:
    autohide: true
manual_apps:
- name: Elgato Camera Hub
  url: https://www.elgato.com/downloads
npm_globals:
- json
prereqs:
- cmd: 'false'
  fix: This warning is expected in e2e.
  id: vpn-like
  kind: cmd
  required: false
  why: exercise the optional-warn path
steps:
- creates: ~/.devseed-e2e-marker
  file: scripts/marker.sh
  id: marker-script
  kind: script
  order: 45
  title: Marker script
- changed_when: '''CHANGED'' in stdout'
  file: scripts/changed-when.sh
  id: changed-when-probe
  kind: script
  order: 47
  title: changed_when probe
- id: import-settings
  instructions: Pretend to import settings, then continue.
  kind: manual
  order: 95
  title: Import app settings
- cmd: touch /Users/admin/.devseed-e2e-backend
  creates: ~/.devseed-e2e-backend
  id: backend-probe
  kind: run
  order: 46
  tags:
  - backend
  title: Backend probe
uv_tools:
- pycowsay
workspace_path: ~/e2e-workspace
