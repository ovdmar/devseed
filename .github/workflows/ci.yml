name: ci

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # install.bats clones this checkout locally
      - name: Install toolchain
        run: brew install bats-core shellcheck shfmt
      - name: Lint
        run: make lint
      - name: Test (macOS /bin/bash 3.2 compatibility enforced by shebang-free sourcing)
        run: make test
      - name: Integration (real brew/defaults in a temp env)
        run: make integration
