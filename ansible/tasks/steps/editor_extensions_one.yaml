---
# One editor's extension set. Included per editor from
# cursor_extensions.yaml, so `editor` is always defined here.
- name: "Locate the editor CLI for {{ editor.name }}"
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -u
      if command -v {{ editor.cli }} >/dev/null 2>&1; then
        command -v {{ editor.cli }}
        exit 0
      fi
      # On a fresh Mac the shim is not on PATH until the app has been
      # opened and "Install '{{ editor.cli }}' command" run, so fall back
      # to the CLI inside the bundle the cask installs.
      for p in "$HOME/Applications/{{ editor.app }}/Contents/Resources/app/bin/{{ editor.cli }}" \
               "/Applications/{{ editor.app }}/Contents/Resources/app/bin/{{ editor.cli }}"; do
        if [ -x "$p" ]; then
          printf '%s\n' "$p"
          exit 0
        fi
      done
      exit 1
  register: devseed_editor_cli
  changed_when: false
  failed_when: false
  environment:
    PATH: "/opt/homebrew/bin:/usr/local/bin:{{ ansible_facts.env.PATH }}"

- name: "Report extensions pending an install of {{ editor.name }}"
  ansible.builtin.debug:
    msg: >-
      EDITOR EXTENSIONS PENDING: {{ editor.name }} is not installed, so
      {{ (devseed_cursor_extensions | default([])) | length }} extension(s)
      were skipped for it. Install it, then re-run `devseed apply`.
  when: devseed_editor_cli.rc | default(1) != 0

# One task rather than a loop, because a looped command cannot report
# changed honestly: `changed_when` cannot see the item's rc, so a failed
# install still counted as a change and would do so on every run forever.
# Some extensions are genuinely uninstallable in some editors — the
# anysphere.* ones are Cursor's own and VS Code rejects them — so that is
# a permanent false "changed", not an edge case. Counting inside the
# script and reading the registered variable is the same shape the mas
# step uses.
- name: "Install missing extensions for {{ editor.name }}"
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -u -o pipefail
      cli={{ devseed_editor_cli.stdout | quote }}
      have=$("$cli" --list-extensions 2>/dev/null | tr '[:upper:]' '[:lower:]')
      installed=0
      failed=""
      while IFS= read -r ext; do
        [ -n "$ext" ] || continue
        lower=$(printf '%s' "$ext" | tr '[:upper:]' '[:lower:]')
        case "
      $have" in *"
      $lower"*) continue ;; esac
        if "$cli" --install-extension "$ext" >/dev/null 2>&1; then
          installed=$((installed + 1))
        else
          failed="$failed $ext"
        fi
      done <<'EXTS_EOF'
      {% for ext in devseed_cursor_extensions | default([]) %}
      {{ ext }}
      {% endfor %}
      EXTS_EOF
      echo "installed=$installed"
      [ -n "$failed" ] && echo "unavailable:$failed"
      exit 0
  register: devseed_editor_result
  changed_when: "'installed=0' not in devseed_editor_result.stdout"
  when: devseed_editor_cli.rc | default(1) == 0

- name: "Report extensions unavailable for {{ editor.name }}"
  ansible.builtin.debug:
    msg: >-
      NOT AVAILABLE for {{ editor.name }}:
      {{ devseed_editor_result.stdout_lines | select('match', '^unavailable:') | first | replace('unavailable:', '') }}
      — this editor's marketplace does not carry them.
  when:
    - devseed_editor_result.skipped is not defined
    - devseed_editor_result.stdout is defined
    - devseed_editor_result.stdout is search('unavailable:')
