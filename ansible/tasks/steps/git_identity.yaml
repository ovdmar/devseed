---
- name: Set git user.name
  community.general.git_config:
    name: user.name
    scope: global
    value: "{{ (devseed_identity | default({})).git_name }}"
  when: (devseed_identity | default({})).git_name is defined

- name: Set git user.email
  community.general.git_config:
    name: user.email
    scope: global
    value: "{{ (devseed_identity | default({})).git_email }}"
  when: (devseed_identity | default({})).git_email is defined
